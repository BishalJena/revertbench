[project]
name = "revertbench"
version = "0.0.1"
description = "An RL environment and eval built from real regressions in open-source history."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "coverage>=7.17.3",
    "docker>=7.1.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "pytest-asyncio==1.5.0",
    "six==1.17.0",
    "typer>=0.29.1",
]

[project.scripts]
revertbench = "revertbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revertbench"]

[tool.uv]
# Supply-chain guard: only resolve package versions published at least 7 days before this date.
exclude-newer = "2026-11-14T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: requires --run-docker and an operational Docker daemon"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-docker>=7.2.0.20261102",
]
